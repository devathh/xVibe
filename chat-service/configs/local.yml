# global environment
env: dev

# naming of current service
app:
  name: xvibe-chat-service
  version: v0.0.1

# settings of server's runner
server:
  grpc:
    host: 0.0.0.0
    port: 50051
    protocol: tcp
    # tls config
    tls:
      enable: false
      server-cert: ./
      server-key: ./
      ca-cert: ./
  # request's timeout
  timeout: 2s

# service's settings (ex. cache ttl)
service:
  cache:
    chats-ttl: 5m

# secrets is taken from .env
secrets:
  postgres:
    host: localhost
    port: 5432
    sslmode: disable
    auth:
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      dbname: ${POSTGRES_DBNAME}
    conn:
      max-idles: 30
      max-opens: 15
      max-lifetime: 15m
      max-idle-time: 30m
  
  redis:
    host: localhost
    port: 6379
    auth:
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      db: ${REDIS_DB}

  jwt:
    public-key-path: ./jwtRS256.key.pub